module_name: claw_controller

parameters:
    - group: Claw Controller
      definitions:

        CLAW_RC_THR:
            description:
                short: RC threshold for grab position [-1, 1]
                long: |
                  When the RC channel value is above this threshold the claw
                  moves to grab. Below it releases.
            type: float
            min: -1.0
            max: 1.0
            default: 0.5

        CLAW_GRAB_TO:
            description:
                short: Grab hold time before state locks to GRABBED [s]
                long: |
                  After the grab command is issued the controller waits this many
                  seconds (servo travel time) before considering the grab complete
                  and locking the GRABBED state. This is the configurable hold time.
            type: float
            unit: s
            min: 0.1
            max: 10.0
            default: 1.0

        CLAW_REL_TO:
            description:
                short: Release travel time before returning to IDLE [s]
            type: float
            unit: s
            min: 0.1
            max: 10.0
            default: 1.0

        CLAW_GRAB_POS:
            description:
                short: Servo position when claw is fully grabbed [-1, 1]
                long: |
                  Normalised servo position used after the grab timeout expires
                  (GRABBED state). This is where the claw holds the object.
                  Maps linearly to PWM_MAIN_MIN8 … PWM_MAIN_MAX8.
            type: float
            min: -1.0
            max: 1.0
            default: 1.0

        CLAW_REL_POS:
            description:
                short: Servo position when claw is fully released / idle [-1, 1]
                long: |
                  Normalised servo position in the IDLE state (claw open, no object).
            type: float
            min: -1.0
            max: 1.0
            default: -1.0

        CLAW_FLY_POS:
            description:
                short: Servo position during grab/release transit in flight [-1, 1]
                long: |
                  Normalised servo position used while the claw is in motion
                  (GRABBING or RELEASING states). Allows a mid-travel hold angle
                  different from the fully open/closed positions, e.g. a safe
                  in-flight posture.
            type: float
            min: -1.0
            max: 1.0
            default: 0.0

        CLAW_LAND_POS:
            description:
                short: Servo position used as landing support leg [-1, 1]
                long: |
                  When the vehicle is detected as landed (vehicle_land_detected.landed)
                  the claw is automatically commanded to this position to act as a
                  landing leg / skid. Tune to the angle that gives stable ground contact.
            type: float
            min: -1.0
            max: 1.0
            default: 0.0
